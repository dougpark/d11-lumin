<!DOCTYPE html>

<head>
    <script>
        // Set the theme class before first paint to avoid a light-mode flash.
        (function () {
            const stored = localStorage.getItem('theme')
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
            if (stored ? stored === 'dark' : prefersDark) document.documentElement.classList.add('dark')
        })()
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'g-blue': 'var(--accent-blue)',
                        'g-blue-hover': 'var(--accent-blue-hover)',
                        'g-blue-bg': 'var(--accent-blue-bg)',
                        'g-black': 'var(--text-primary)',
                        'g-gray': 'var(--text-secondary)',
                        'g-border': 'var(--border-color)',
                        'g-bg': 'var(--bg-primary)',
                    },
                },
            },
        }
    </script>
    <style>
        :root {
            --accent-blue: #5b7083;
            --accent-blue-hover: #475868;
            --accent-blue-bg: #e8eef3;
            --bg-primary: #ffffff;
            --bg-secondary: #F3F4F6;
            --text-primary: #1F1F1F;
            --text-secondary: #474747;
            --border-color: #E3E3E3;
            --code-bg: #F3F4F6;
            --code-text: #1F1F1F;
            --blockquote-border: #0066cc;
            --blockquote-bg: #f9f9f9;
            --post-date-color: #64748b;
            --input-border: #cbd5e1;
            --input-bg: #f8fafc;
            --input-bg-focus: #ffffff;
            --input-shadow: rgba(91, 112, 131, 0.15);
            --banner-dot-color: rgba(91, 112, 131, 0.35);
        }

        html.dark {
            /* VS Code "Dark+" palette */
            --accent-blue: #569CD6;
            --accent-blue-hover: #7DB7E8;
            --accent-blue-bg: #252526;
            --bg-primary: #1E1E1E;
            --bg-secondary: #252526;
            --text-primary: #D4D4D4;
            --text-secondary: #9D9D9D;
            --border-color: #3C3C3C;
            --code-bg: #2D2D30;
            --code-text: #D4D4D4;
            --blockquote-border: #569CD6;
            --blockquote-bg: #252526;
            --post-date-color: #858585;
            --input-border: #3C3C3C;
            --input-bg: #3C3C3C;
            --input-bg-focus: #2A2D2E;
            --input-shadow: rgba(86, 156, 214, 0.25);
            --banner-dot-color: rgba(86, 156, 214, 0.25);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Home-list clamp: ~800px ≈ 300-350 words of prose. Fade + "Read more" appear only when content overflows. */
        .blog-body.is-clamped {
            max-height: 800px;
            overflow: hidden;
            position: relative;
            -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 96px), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 96px), transparent);
        }

        .read-more {
            display: inline-block;
            margin-top: 0.5rem;
            font-weight: 500;
            color: var(--accent-blue);
        }

        .read-more:hover {
            color: var(--accent-blue-hover);
            text-decoration: underline;
        }

        .blog-body img {
            cursor: zoom-in;
        }

        #lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background: rgba(0, 0, 0, 0.92);
            cursor: zoom-out;
            overscroll-behavior: contain;
            touch-action: none;
        }

        #lightbox.open {
            display: flex;
        }

        #lightbox img {
            max-width: 100vw;
            max-height: 100vh;
            max-height: 100dvh;
            object-fit: contain;
            transform-origin: center center;
            will-change: transform;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }

        #lightbox button {
            position: absolute;
            top: calc(env(safe-area-inset-top) + 12px);
            right: 12px;
            width: 44px;
            height: 44px;
            border-radius: 9999px;
            border: 0;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
        }

        .blog-body img {
            display: block;
            max-width: 100%;
            border-radius: 12px;
            margin: 1rem auto;
        }

        .blog-body p {
            margin: 0.85rem 0;
            line-height: 1.7;
        }

        .blog-body h1,
        .blog-body h2,
        .blog-body h3 {
            font-weight: 700;
            margin: 1.5rem 0 0.5rem;
        }

        .blog-body a {
            color: var(--accent-blue);
            text-decoration: underline;
        }

        .blog-body pre {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 1rem;
            border-radius: 10px;
            overflow-x: auto;
        }

        .blog-body code {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 0.1rem 0.35rem;
            border-radius: 6px;
        }

        /* Code blocks already style .blog-body pre — reset the inline-code look so
           the background/padding don't double up inside the block. */
        .blog-body pre code {
            background: none;
            color: inherit;
            padding: 0;
            border-radius: 0;
        }

        .blog-body blockquote {
            border-left: 4px solid var(--blockquote-border);
            margin: 1.5em 0;
            padding: 0.5em 1em;
            background-color: var(--blockquote-bg);
            font-style: italic;
        }

        .blog-body blockquote p {
            margin: 0.5em 0;
        }

        .blog-body blockquote p:first-child {
            margin-top: 0;
        }

        .blog-body blockquote p:last-child {
            margin-bottom: 0;
        }

        .blog-post-card {
            padding: 1.25rem 1.5rem;
        }

        /* Home article list: plain rows separated by a blue rule, no card chrome. */
        .home-post-card {
            padding: 1.25rem 0;
        }

        .home-post-card:not(:last-child) {
            border-bottom: 1px solid var(--accent-blue);
        }

        .post-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent-blue);
            line-height: 1.3;
            margin: 0;
        }

        .post-date {
            font-size: 0.8rem;
            color: var(--post-date-color);
            margin: 0.2rem 0 0.85rem;
        }

        .search-input {
            width: 100%;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            font-size: 0.95rem;
            background-color: var(--input-bg);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }

        .search-input:focus {
            background-color: var(--input-bg-focus);
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px var(--input-shadow);
        }

        .post-nav-prev,
        .post-nav-next {
            display: inline-block;
            transition: transform 0.15s ease;
        }

        .post-nav-prev:hover {
            transform: translateX(-3px);
        }

        .post-nav-next:hover {
            transform: translateX(3px);
        }

        /* Dot-matrix hero banner (Tailwind CDN has no build step, so this replaces
           a plugin like tailwindcss-hero-patterns with a plain CSS equivalent). */
        .post-banner {
            background-color: var(--accent-blue-bg);
            background-image: radial-gradient(var(--banner-dot-color) 1px, transparent 1px);
            background-size: 16px 16px;
        }
    </style>
</head>

    <main id="app" class="max-w-3xl mx-auto px-4 py-8 min-h-[60vh]" %%SSR_ATTR%%>%%SSR_CONTENT%%</main>

    <footer class="border-t border-g-border mt-12">
        <p class="max-w-3xl mx-auto px-4 py-6 text-xs text-g-gray text-center">&copy; 2026 theanalogpixel.com &bull;

    <script>
        const app = document.getElementById('app')
        const state = { posts: null, tag: '', q: '', searchOpen: false }
        let blogTags = null
        let tagsRequest = null
        let listRequest = 0
        const defaultTitle = document.title

        // Sun/moon toggle: flips the `dark` class (drives CSS vars + the hljs stylesheet swap) and persists the choice.
        function applyTheme(isDark) {
            document.getElementById('theme-icon-sun').classList.toggle('hidden', !isDark)
            document.getElementById('theme-icon-moon').classList.toggle('hidden', isDark)
            document.getElementById('hljs-theme-dark').disabled = !isDark
            document.getElementById('hljs-theme-light').disabled = isDark
        }

        applyTheme(document.documentElement.classList.contains('dark'))

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark')
            localStorage.setItem('theme', isDark ? 'dark' : 'light')
            applyTheme(isDark)
        })

        document.getElementById('search-toggle').addEventListener('click', () => {
            const wrap = document.getElementById('blog-search-wrap') || document.getElementById('archive-search-wrap')
            if (!wrap) {
                state.searchOpen = true
                navigate('/blog')
                document.getElementById('blog-search')?.focus()
                return
            }
            state.searchOpen = !state.searchOpen
            wrap.classList.toggle('hidden', !state.searchOpen)
            if (state.searchOpen) {
                (document.getElementById('blog-search') || document.getElementById('archive-search'))?.focus()
                updateTagSearch()
            } else if (state.q) {
                state.q = ''
                if (document.getElementById('blog-search-wrap')) {
                    document.getElementById('blog-search').value = ''
                    resetToFirstPage()
                    renderList()
                } else {
                    document.getElementById('archive-search').value = ''
                    renderArchive()
                }
            }
        })

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
        }

        function formatDate(iso) {
            if (!iso) return ''
            return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })
        }

        // Syntax-highlight fenced code blocks via highlight.js (loaded from cdnjs) so
        // marked's default `<pre><code>` output gets the `hljs` token classes/theme.
        const markedRenderer = (typeof marked !== 'undefined' && typeof marked.Renderer === 'function') ? new marked.Renderer() : null
        if (markedRenderer) {
            markedRenderer.code = ({ text, lang }) => {
                const language = (lang || '').split(/\s+/)[0]
                let highlighted
                try {
                    highlighted = (typeof hljs !== 'undefined')
                        ? (language && hljs.getLanguage(language) ? hljs.highlight(text, { language }).value : hljs.highlightAuto(text).value)
                        : esc(text)
                } catch {
                    highlighted = esc(text)
                }
                return `<pre><code class="hljs${language ? ` language-${language}` : ''}">${highlighted}</code></pre>`
            }
        }

        // Markdown -> HTML via the shared `marked` renderer (gfm + blockquotes/lists/etc.).
        // Attachment URLs in post content are already rewritten to CDN URLs at publish time.
        function renderMarkdown(md) {
            if (!md) return ''
            if (typeof marked === 'undefined' || typeof marked.parse !== 'function') return `<p>${esc(md)}</p>`
            try {
                const html = marked.parse(md, { breaks: true, gfm: true, renderer: markedRenderer || undefined })
                // `![alt](url){width=300}` → marked leaves the `{…}` as text right after the <img>; fold it into a width attribute.
                return html.replace(/(<img\b[^>]*?)\s*\/?>\{width=(\d{1,4})(px)?\}/g, '$1 width="$2">')
            }
            catch { return `<p>${esc(md)}</p>` }
        }

        function navigate(path, { replace = false } = {}) {
            if (replace) history.replaceState({}, '', path)
            else history.pushState({}, '', path)
            window.scrollTo(0, 0)
            route()
        }

        document.addEventListener('click', (event) => {
            const link = event.target.closest('[data-internal-link], a[data-post-link]')
            if (!link) return
            event.preventDefault()
            navigate(link.getAttribute('href'))
        })

        window.addEventListener('popstate', route)

        // Lightbox: delegated so it covers images in every rendered post. Dismiss via tap anywhere, ✕, or Esc.
        const lightbox = document.createElement('div')
        lightbox.id = 'lightbox'
        lightbox.setAttribute('role', 'dialog')
        lightbox.setAttribute('aria-modal', 'true')
        lightbox.innerHTML = '<img alt=""><button type="button" aria-label="Close image">&times;</button>'
        document.body.appendChild(lightbox)
        const lightboxImg = lightbox.querySelector('img')

        // Zoom/pan state. Transform origin is the image centre, so tx/ty are offsets from centre.
        const zoom = { s: 1, tx: 0, ty: 0 }
        const MAX_ZOOM = 6
        const pointers = new Map()
        let gesture = null // snapshot taken when the pointer count changes
        let moved = false

        function applyZoom() {
            lightboxImg.style.transform = `translate(${zoom.tx}px, ${zoom.ty}px) scale(${zoom.s})`
        }

        function resetZoom() {
            zoom.s = 1; zoom.tx = 0; zoom.ty = 0
            applyZoom()
        }

        function closeLightbox() {
            lightbox.classList.remove('open')
            lightboxImg.removeAttribute('src')
            document.body.style.overflow = ''
            pointers.clear()
            gesture = null
            resetZoom()
        }

        // Coordinates relative to the viewport centre.
        function centred(x, y) {
            return { x: x - window.innerWidth / 2, y: y - window.innerHeight / 2 }
        }

        function startGesture() {
            const pts = [...pointers.values()]
            if (!pts.length) { gesture = null; return }
            const mid = centred(pts.reduce((a, p) => a + p.x, 0) / pts.length, pts.reduce((a, p) => a + p.y, 0) / pts.length)
            const dist = pts.length > 1 ? Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) : 0
            gesture = { mid, dist, s: zoom.s, tx: zoom.tx, ty: zoom.ty, count: pts.length }
        }

        // Zoom about a viewport point so the content under it stays put.
        function zoomAt(mid, newScale, base) {
            const s = Math.min(MAX_ZOOM, Math.max(1, newScale))
            const ix = (mid.x - base.tx) / base.s
            const iy = (mid.y - base.ty) / base.s
            zoom.s = s
            zoom.tx = mid.x - ix * s
            zoom.ty = mid.y - iy * s
        }

        lightbox.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button')) return
            lightbox.setPointerCapture(e.pointerId)
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY })
            if (pointers.size === 1) moved = false
            startGesture()
        })

        lightbox.addEventListener('pointermove', (e) => {
            if (!pointers.has(e.pointerId) || !gesture) return
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY })
            const pts = [...pointers.values()]
            const mid = centred(pts.reduce((a, p) => a + p.x, 0) / pts.length, pts.reduce((a, p) => a + p.y, 0) / pts.length)
            if (pts.length >= 2 && gesture.dist > 0) {
                moved = true
                const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y)
                zoomAt(gesture.mid, gesture.s * dist / gesture.dist, gesture)
                zoom.tx += mid.x - gesture.mid.x
                zoom.ty += mid.y - gesture.mid.y
                applyZoom()
            } else if (pts.length === 1) {
                const dx = mid.x - gesture.mid.x
                const dy = mid.y - gesture.mid.y
                if (Math.hypot(dx, dy) > 8) moved = true
                if (moved && zoom.s > 1) {
                    zoom.tx = gesture.tx + dx
                    zoom.ty = gesture.ty + dy
                    applyZoom()
                }
            }
        })

        function endPointer(e) {
            if (!pointers.has(e.pointerId)) return
            const wasSingle = pointers.size === 1
            pointers.delete(e.pointerId)
            if (zoom.s < 1.05) resetZoom()
            if (pointers.size) { startGesture(); return }
            gesture = null
            // A clean tap closes at 1x; while zoomed it just returns to 1x.
            if (wasSingle && !moved && e.type === 'pointerup') {
                if (zoom.s > 1) resetZoom()
                else closeLightbox()
            }
        }

        lightbox.addEventListener('pointerup', endPointer)
        lightbox.addEventListener('pointercancel', endPointer)
        lightbox.addEventListener('click', (e) => e.stopPropagation())
        lightbox.querySelector('button').addEventListener('click', closeLightbox)

        // Desktop: wheel / trackpad pinch (ctrl+wheel) zooms about the cursor.
        lightbox.addEventListener('wheel', (e) => {
            e.preventDefault()
            const base = { s: zoom.s, tx: zoom.tx, ty: zoom.ty }
            zoomAt(centred(e.clientX, e.clientY), zoom.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002)), base)
            if (zoom.s < 1.05) resetZoom()
            else applyZoom()
        }, { passive: false })

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox() })

        document.addEventListener('click', (event) => {
            const img = event.target.closest('.blog-body img')
            if (!img) return
            event.preventDefault()
            event.stopPropagation()
            lightboxImg.src = img.currentSrc || img.src
            lightboxImg.alt = img.alt || ''
            lightbox.classList.add('open')
            document.body.style.overflow = 'hidden'
        }, true)

        async function fetchJson(url) {
            const res = await fetch(url)
            if (!res.ok) throw new Error(`Request failed: ${res.status}`)
            return res.json()
        }

        function renderPostTags(tags, activeTag) {
            return tags.map((tag) => `
                <button type="button" data-tag="${esc(tag)}"
                    class="text-xs px-2 py-0.5 rounded-full border ${tag === activeTag ? 'bg-g-blue text-white border-g-blue' : 'border-g-border text-g-gray hover:border-g-blue-hover'}">
                    ${esc(tag)}
                </button>
            `).join('')
        }

        function renderCopyLinkButton(slug, size = 'md') {
            const btnSize = size === 'sm' ? 'h-6 w-6' : 'h-7 w-7'
            const iconSize = size === 'sm' ? 'h-3.5 w-3.5' : 'h-4 w-4'
            return `
                <button type="button" data-copy-slug="${esc(slug)}" title="Copy link" aria-label="Copy link"
                    class="inline-flex items-center justify-center ${btnSize} rounded-full text-g-gray hover:text-g-blue-hover hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
                    <svg data-icon="link" xmlns="http://www.w3.org/2000/svg" class="${iconSize}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                    </svg>
                    <svg data-icon="check" class="${iconSize} hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                    </svg>
                </button>
            `
        }

        function bindCopyLinkButtons(container) {
            container.querySelectorAll('[data-copy-slug]').forEach((btn) => {
                btn.addEventListener('click', () => copyPostLink(btn.getAttribute('data-copy-slug'), btn))
            })
        }

        function listQuery(extra = {}) {
            const params = new URLSearchParams(extra)
            if (state.q) params.set('q', state.q)
            if (state.tag) params.set('tag', state.tag)
            const qs = params.toString()
            return qs ? `?${qs}` : ''
        }

        function renderSearchControls(prefix) {
            return `
                <div id="${prefix}-search-wrap" class="mb-3 ${state.searchOpen ? '' : 'hidden'}">
                    <input id="${prefix}-search" type="search" placeholder="Search posts or tags…" aria-label="Search posts or tags"
                        value="${esc(state.q)}" class="search-input">
                    <div id="tag-suggestions" class="flex flex-wrap items-center gap-2 mt-2" aria-label="Matching tags"></div>
                </div>
                <div id="active-tag-filter" class="mb-3"></div>
            `
        }

        function refreshSearchResults() {
            if (document.getElementById('archive-search')) renderArchive()
            else if (document.getElementById('blog-search')) {
                resetToFirstPage()
                renderList()
            }
        }

        function bindSearchControls(prefix) {
            const input = document.getElementById(`${prefix}-search`)
            const refresh = debounce(() => {
                if (document.getElementById(`${prefix}-search`) === input) refreshSearchResults()
            }, 300)
            input.addEventListener('input', () => {
                state.q = input.value.trim()
                updateTagSearch()
                refresh()
            })
        }

        async function updateTagSearch() {
            const active = document.getElementById('active-tag-filter')
            const suggestions = document.getElementById('tag-suggestions')
            if (!active || !suggestions) return
            active.innerHTML = state.tag ? `
                <button type="button" data-clear-tag aria-label="Remove tag filter: ${esc(state.tag)}"
                    class="text-xs px-3 py-1 rounded-full border border-g-blue bg-g-blue text-white">
                    ${esc(state.tag)} &times;
                </button>` : ''
            active.querySelector('[data-clear-tag]')?.addEventListener('click', () => {
                state.tag = ''
                refreshSearchResults()
            })
            if (!state.searchOpen || !state.q) {
                suggestions.innerHTML = ''
                return
            }
            try {
                if (!blogTags) {
                    if (!tagsRequest) tagsRequest = fetchJson('/api/blog/tags').then(({ data }) => data)
                    blogTags = await tagsRequest
                }
            } catch (error) {
                tagsRequest = null
                console.error('Failed to load blog tags', error)
                if (document.getElementById('tag-suggestions') === suggestions) {
                    suggestions.innerHTML = '<p class="text-xs text-g-gray" role="status">Tag suggestions could not be loaded. Try typing again.</p>'
                }
                return
            }
            if (document.getElementById('tag-suggestions') !== suggestions) return
            const matches = state.searchOpen && state.q
                ? blogTags.filter((tag) => tag !== state.tag && tag.toLowerCase().includes(state.q.toLowerCase())).slice(0, 8)
                : []
            suggestions.innerHTML = matches.length ? `<span class="text-xs text-g-gray">Tags:</span>` + matches.map((tag) => `
                <button type="button" data-search-tag="${esc(tag)}"
                    class="text-xs px-3 py-1 rounded-full border border-g-border text-g-gray hover:border-g-blue-hover">
                    ${esc(tag)}
                </button>`).join('') : ''
            suggestions.querySelectorAll('[data-search-tag]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    state.tag = btn.getAttribute('data-search-tag')
                    state.q = ''
                    const input = document.getElementById('blog-search') || document.getElementById('archive-search')
                    input.value = ''
                    input.focus()
                    refreshSearchResults()
                })
            })
        }

        // Search/tag changes always restart at page 1 (/blog).
        function resetToFirstPage() {
            if (location.pathname !== '/blog') history.replaceState({}, '', '/blog')
        }

        function pageHref(page) {
            return page <= 1 ? '/blog' : `/blog/page/${page}`
        }

        async function renderList(page = 1) {
            document.title = page > 1 ? `Page ${page} — ${defaultTitle}` : defaultTitle

            const isFirstRender = !document.getElementById('blog-search')
            if (isFirstRender) {
                app.innerHTML = `
                    ${renderSearchControls('blog')}
                    <div class="border-b-2 border-dotted border-g-border mb-5"></div>
                    <div id="blog-results"><p class="text-sm text-g-gray">Loading…</p></div>
                `

                bindSearchControls('blog')
            }

            updateTagSearch()
            const request = ++listRequest
            const results = document.getElementById('blog-results')
            const { data: posts, meta } = await fetchJson(`/api/blog.json${listQuery({ page })}`)
            if (request !== listRequest || document.getElementById('blog-results') !== results) return
            const hasMore = !!meta?.has_more

            document.getElementById('blog-results').innerHTML = `
                ${posts.length ? posts.map((post) => `
                    <article class="home-post-card">
                        <a href="/blog/${esc(post.slug)}" data-post-link class="block group">
                            <h2 class="post-title group-hover:underline">${esc(post.title || 'Untitled')}</h2>
                        </a>
                        <div class="post-date flex items-center gap-2 flex-wrap">
                            <span>${formatDate(post.published_at)}</span>
                            ${renderPostTags(post.tags, state.tag)}
                            ${renderCopyLinkButton(post.slug, 'sm')}
                        </div>
                        <div class="blog-body is-clamped mt-2" data-clamp>${renderMarkdown(post.content || '')}</div>
                        <a href="/blog/${esc(post.slug)}" data-post-link class="read-more hidden">Read more →</a>
                    </article>
                `).join('') : `<p class="text-sm text-g-gray">${page > 1 ? `No posts on page ${page}. <a href="/blog" data-internal-link class="text-g-blue hover:underline">Back to the latest posts</a>` : 'No posts yet.'}</p>`}
                ${page > 1 || hasMore ? `
                    <nav class="flex items-center justify-between gap-4 mt-8 pt-5 border-t-2 border-dotted border-g-border text-sm" aria-label="Pagination">
                        ${page > 1 ? `<a href="${pageHref(page - 1)}" data-internal-link rel="prev" class="text-g-blue hover:underline">&larr; Newer posts</a>` : '<span></span>'}
                        <span class="text-g-gray">Page ${page}</span>
                        ${hasMore ? `<a href="${pageHref(page + 1)}" data-internal-link rel="next" class="text-g-blue hover:underline">Older posts &rarr;</a>` : '<span></span>'}
                    </nav>
                ` : ''}
            `

            // Only clamp posts that actually overflow; re-check once images load since they change height.
            const applyClamp = (body) => {
                const link = body.nextElementSibling
                const overflows = body.scrollHeight > 800
                body.classList.toggle('is-clamped', overflows)
                link.classList.toggle('hidden', !overflows)
            }
            document.querySelectorAll('[data-clamp]').forEach((body) => {
                body.classList.remove('is-clamped')
                applyClamp(body)
                body.querySelectorAll('img').forEach((img) => img.addEventListener('load', () => applyClamp(body)))
            })

            app.querySelectorAll('[data-tag]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const tag = btn.getAttribute('data-tag')
                    state.tag = state.tag === tag ? '' : tag
                    state.searchOpen = true
                    document.getElementById('blog-search-wrap').classList.remove('hidden')
                    resetToFirstPage()
                    renderList()
                })
            })

            bindCopyLinkButtons(document.getElementById('blog-results'))
        }

        // Every post (title + date only), grouped by year. Honours the same search/tag filter as the home page.
        async function renderArchive() {
            document.title = `Archive — ${defaultTitle}`

            const isFirstRender = !document.getElementById('archive-search')
            if (isFirstRender) {
                state.searchOpen = true
                app.innerHTML = `
                    <a href="/blog" data-internal-link class="text-sm text-g-blue hover:underline">&larr; All posts</a>
                    <h1 class="text-2xl font-bold mt-4 mb-4">Archive</h1>
                    ${renderSearchControls('archive')}
                    <div id="archive-results"><p class="text-sm text-g-gray">Loading…</p></div>
                `

                bindSearchControls('archive')
            }

            updateTagSearch()
            const request = ++listRequest
            const results = document.getElementById('archive-results')
            const { data: posts } = await fetchJson(`/api/blog/archive.json${listQuery()}`)
            if (request !== listRequest || document.getElementById('archive-results') !== results) return

            const years = []
            for (const post of posts) {
                const year = post.published_at ? new Date(post.published_at).getFullYear() : 'Undated'
                if (years.at(-1)?.year !== year) years.push({ year, posts: [] })
                years.at(-1).posts.push(post)
            }
            const shortDate = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : ''

            document.getElementById('archive-results').innerHTML = `
                <p class="text-sm text-g-gray mb-4 flex items-center gap-2 flex-wrap">
                    <span>${posts.length} post${posts.length === 1 ? '' : 's'}</span>
                </p>
                ${posts.length ? years.map(({ year, posts }) => `
                    <section class="mb-6">
                        <h2 class="text-lg font-bold mb-2">${year} <span class="text-sm font-normal text-g-gray">(${posts.length})</span></h2>
                        <ul class="space-y-1.5">
                            ${posts.map((post) => `
                                <li class="flex gap-3 items-baseline">
                                    <span class="post-date shrink-0 w-14 tabular-nums">${shortDate(post.published_at)}</span>
                                    <a href="/blog/${esc(post.slug)}" data-post-link class="hover:underline">${esc(post.title || 'Untitled')}</a>
                                </li>
                            `).join('')}
                        </ul>
                    </section>
                `).join('') : '<p class="text-sm text-g-gray">No posts found.</p>'}
            `

        }


        async function renderPost(slug) {
            // Keep the server-rendered article visible (no "Loading…" flash) until the SPA version replaces it.
            if (app.dataset.ssr !== `/blog/${slug}`) app.innerHTML = `<p class="text-sm text-g-gray">Loading…</p>`
            delete app.dataset.ssr
            try {
                const { data: post, meta } = await fetchJson(`/api/blog/${encodeURIComponent(slug)}`)
                document.title = `${post.title} - The Analog Pixel`

                app.innerHTML = `
                    <a href="/blog" data-internal-link class="text-sm text-g-blue hover:underline">&larr; All posts</a>
                    <article class="mt-4">
                        <div class="post-banner rounded-2xl border border-g-border px-6 py-8">
                            <h1 class="text-2xl font-bold">${esc(post.title || 'Untitled')}</h1>
                            <p class="text-xs text-g-gray mt-1">${formatDate(post.published_at)}</p>
                            <div class="flex flex-wrap items-center gap-2 mt-3">
                                ${post.tags.map((t) => `<button type="button" data-post-tag="${esc(t)}" class="text-xs px-3 py-1 rounded-full border border-g-border bg-g-bg text-g-gray shadow-sm hover:border-g-blue-hover hover:text-g-blue-hover">${esc(t)}</button>`).join('')}
                                ${renderCopyLinkButton(slug)}
                            </div>
                        </div>
                        <div class="blog-body mt-6">${renderMarkdown(post.content || '')}</div>
                    </article>
                    <nav class="flex items-center justify-between mt-10 pt-6 border-t border-g-border text-sm">
                        ${meta.prev ? `<a href="/blog/${esc(meta.prev.slug)}" data-post-link class="post-nav-prev text-g-blue hover:underline">&larr; ${esc(meta.prev.title)}</a>` : '<span></span>'}
                        ${meta.next ? `<a href="/blog/${esc(meta.next.slug)}" data-post-link class="post-nav-next text-g-blue hover:underline">${esc(meta.next.title)} &rarr;</a>` : '<span></span>'}
                    </nav>
                `

                app.querySelectorAll('[data-post-tag]').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        state.tag = btn.getAttribute('data-post-tag')
                        state.searchOpen = true
                        navigate('/blog')
                    })
                })

                bindCopyLinkButtons(app)
            } catch {
                app.innerHTML = `<p class="text-sm text-g-gray">Post not found. <a href="/blog" data-internal-link class="text-g-blue hover:underline">Back to all posts</a></p>`
            }
        }

        function debounce(fn, wait) {
            let timer = null
            return (...args) => {
                clearTimeout(timer)
                timer = setTimeout(() => fn(...args), wait)
            }
        }

        function showToast(message) {
            document.getElementById('copy-toast')?.remove()
            const toast = document.createElement('div')
            toast.id = 'copy-toast'
            toast.textContent = message
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-neutral-800 text-white text-sm px-4 py-2 rounded-full shadow-lg z-50 opacity-0 transition-opacity duration-200'
            document.body.appendChild(toast)
            requestAnimationFrame(() => toast.classList.remove('opacity-0'))
            setTimeout(() => {
                toast.classList.add('opacity-0')
                setTimeout(() => toast.remove(), 200)
            }, 2000)
        }

        async function copyPostLink(slug, btn) {
            const url = `${location.origin}/blog/${encodeURIComponent(slug)}`
            try { await navigator.clipboard.writeText(url) } catch { /* clipboard blocked; toast still confirms intent */ }

            const linkIcon = btn.querySelector('[data-icon="link"]')
            const checkIcon = btn.querySelector('[data-icon="check"]')
            linkIcon.classList.add('hidden')
            checkIcon.classList.remove('hidden')
            btn.classList.add('text-green-600')
            showToast('Link copied!')

            setTimeout(() => {
                linkIcon.classList.remove('hidden')
                checkIcon.classList.add('hidden')
                btn.classList.remove('text-green-600')
            }, 2000)
        }

        function route() {
            const path = window.location.pathname.replace(/\/$/, '') || '/'
            const match = path.match(/^\/blog\/([^/]+)$/)
            const pageMatch = path.match(/^\/blog\/page\/(\d+)$/)
            const queryPost = new URLSearchParams(window.location.search).get('post')
            if (path === '/blog/archive') {
                renderArchive()
            } else if (pageMatch) {
                renderList(Math.max(Number(pageMatch[1]), 1))
            } else if (match) {
                renderPost(decodeURIComponent(match[1]))
            } else if (queryPost) {
                renderPost(queryPost)
            } else {
                renderList()
            }
        }

        route()
    </script>
</body>

</html>
<title>The Analog Pixel</title>
