<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>%%OG_TITLE%% — d11.me Blog</title>
    <meta name="description" content="%%OG_DESC%%">
    <link rel="canonical" href="%%OG_URL%%">
    <meta property="og:type" content="article">
    <meta property="og:title" content="%%OG_TITLE%%">
    <meta property="og:description" content="%%OG_DESC%%">
    <meta property="og:url" content="%%OG_URL%%">
    <meta property="og:image" content="%%OG_IMAGE%%">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="alternate" type="application/rss+xml" title="d11.me Blog Feed" href="/rss.xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'g-blue': '#4285F4',
                        'g-black': '#1F1F1F',
                        'g-gray': '#474747',
                        'g-border': '#E3E3E3',
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .blog-body img {
            max-width: 100%;
            border-radius: 12px;
            margin: 1rem 0;
        }

        .blog-body p {
            margin: 0.85rem 0;
            line-height: 1.7;
        }

        .blog-body h1,
        .blog-body h2,
        .blog-body h3 {
            font-weight: 700;
            margin: 1.5rem 0 0.5rem;
        }

        .blog-body a {
            color: #4285F4;
            text-decoration: underline;
        }

        .blog-body pre {
            background: #1F1F1F;
            color: #fff;
            padding: 1rem;
            border-radius: 10px;
            overflow-x: auto;
        }

        .blog-body code {
            background: #F3F4F6;
            padding: 0.1rem 0.35rem;
            border-radius: 6px;
        }
    </style>
</head>

<body class="bg-white text-g-black">

    <header class="border-b border-g-border">
        <nav class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/start" class="flex-shrink-0">
                    <img src="/lumin_navbar_650.jpeg" alt="Lumin" class="h-8 w-auto">
                </a>
                <a href="/blog" class="font-semibold text-lg" data-internal-link>Lumin Blog</a>
            </div>
            <div class="flex items-center gap-4 text-sm text-g-gray">
                <a href="/blog" data-internal-link class="hover:text-g-blue">Blog</a>
                <a href="/rss.xml" class="hover:text-g-blue">RSS</a>
            </div>
        </nav>
    </header>

    <main id="app" class="max-w-3xl mx-auto px-4 py-8 min-h-[60vh]"></main>

    <footer class="border-t border-g-border mt-12">
        <p class="max-w-3xl mx-auto px-4 py-6 text-xs text-g-gray text-center">&copy; 2026 d11.me &bull; Powered by
            Lumin &amp; Cloudflare Workers</p>
    </footer>

    <script>
        const app = document.getElementById('app')
        const state = { posts: null, tag: '', q: '' }

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
        }

        function formatDate(iso) {
            if (!iso) return ''
            return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })
        }

        // Minimal Markdown -> HTML (images/links/headings/code/bold/italic/paragraphs).
        // Attachment URLs in post content are already rewritten to CDN URLs at publish time.
        function renderMarkdown(md) {
            const escaped = esc(md)
            let html = escaped
                .replace(/^###\s+(.*)$/gm, '<h3>$1</h3>')
                .replace(/^##\s+(.*)$/gm, '<h2>$1</h2>')
                .replace(/^#\s+(.*)$/gm, '<h1>$1</h1>')
                .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" loading="lazy">')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
                .replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code}</code></pre>`)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>')

            return html
                .split(/\n{2,}/)
                .map((block) => (/^<(h1|h2|h3|pre|img)/.test(block.trim()) ? block : `<p>${block.trim()}</p>`))
                .join('\n')
        }

        function navigate(path, { replace = false } = {}) {
            if (replace) history.replaceState({}, '', path)
            else history.pushState({}, '', path)
            route()
        }

        document.addEventListener('click', (event) => {
            const link = event.target.closest('[data-internal-link], a[data-post-link]')
            if (!link) return
            event.preventDefault()
            navigate(link.getAttribute('href'))
        })

        window.addEventListener('popstate', route)

        async function fetchJson(url) {
            const res = await fetch(url)
            if (!res.ok) throw new Error(`Request failed: ${res.status}`)
            return res.json()
        }

        function renderTagChips(tags, activeTag) {
            if (!tags.length) return ''
            return `<div class="flex flex-wrap gap-2 mb-6">${tags.map((tag) => `
                <button type="button" data-tag="${esc(tag)}"
                    class="text-xs px-3 py-1 rounded-full border ${tag === activeTag ? 'bg-g-blue text-white border-g-blue' : 'border-g-border text-g-gray hover:border-g-blue'}">
                    ${esc(tag)}
                </button>
            `).join('')}</div>`
        }

        async function renderList() {
            app.innerHTML = `<p class="text-sm text-g-gray">Loading…</p>`

            const [{ data: posts }, { data: tags }] = await Promise.all([
                fetchJson(`/api/blog.json${state.q ? `?q=${encodeURIComponent(state.q)}` : ''}${state.tag ? `${state.q ? '&' : '?'}tag=${encodeURIComponent(state.tag)}` : ''}`),
                fetchJson('/api/blog/tags'),
            ])

            app.innerHTML = `
                <div class="mb-6">
                    <input id="blog-search" type="search" placeholder="Search posts…" value="${esc(state.q)}"
                        class="w-full text-sm px-4 py-2.5 rounded-full border border-g-border focus:outline-none focus:ring-2 focus:ring-g-blue/20 focus:border-g-blue">
                </div>
                ${renderTagChips(tags, state.tag)}
                <div class="space-y-6">
                    ${posts.length ? posts.map((post) => `
                        <article class="pb-6 border-b border-g-border last:border-0">
                            <a href="/blog/${esc(post.slug)}" data-post-link class="block group">
                                <h2 class="text-xl font-semibold group-hover:text-g-blue transition-colors">${esc(post.title || 'Untitled')}</h2>
                                <p class="text-xs text-g-gray mt-1">${formatDate(post.published_at)}</p>
                                <p class="text-sm text-g-gray mt-2">${esc(post.excerpt)}</p>
                            </a>
                        </article>
                    `).join('') : '<p class="text-sm text-g-gray">No posts yet.</p>'}
                </div>
            `

            document.getElementById('blog-search').addEventListener('input', debounce((event) => {
                state.q = event.target.value.trim()
                renderList()
            }, 300))

            app.querySelectorAll('[data-tag]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const tag = btn.getAttribute('data-tag')
                    state.tag = state.tag === tag ? '' : tag
                    renderList()
                })
            })
        }

        async function renderPost(slug) {
            app.innerHTML = `<p class="text-sm text-g-gray">Loading…</p>`
            try {
                const { data: post, meta } = await fetchJson(`/api/blog/${encodeURIComponent(slug)}`)
                document.title = `${post.title} — d11.me Blog`

                app.innerHTML = `
                    <a href="/blog" data-internal-link class="text-sm text-g-blue hover:underline">&larr; All posts</a>
                    <article class="mt-4">
                        <h1 class="text-2xl font-bold">${esc(post.title || 'Untitled')}</h1>
                        <p class="text-xs text-g-gray mt-1">${formatDate(post.published_at)}</p>
                        ${post.tags.length ? `<div class="flex flex-wrap gap-2 mt-3">${post.tags.map((t) => `<button type="button" data-post-tag="${esc(t)}" class="text-xs px-3 py-1 rounded-full border border-g-border text-g-gray hover:border-g-blue">${esc(t)}</button>`).join('')}</div>` : ''}
                        <div class="blog-body mt-6">${renderMarkdown(post.content || '')}</div>
                    </article>
                    <nav class="flex items-center justify-between mt-10 pt-6 border-t border-g-border text-sm">
                        ${meta.prev ? `<a href="/blog/${esc(meta.prev.slug)}" data-post-link class="text-g-blue hover:underline">&larr; ${esc(meta.prev.title)}</a>` : '<span></span>'}
                        ${meta.next ? `<a href="/blog/${esc(meta.next.slug)}" data-post-link class="text-g-blue hover:underline">${esc(meta.next.title)} &rarr;</a>` : '<span></span>'}
                    </nav>
                `

                app.querySelectorAll('[data-post-tag]').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        state.tag = btn.getAttribute('data-post-tag')
                        navigate('/blog')
                    })
                })
            } catch {
                app.innerHTML = `<p class="text-sm text-g-gray">Post not found. <a href="/blog" data-internal-link class="text-g-blue hover:underline">Back to all posts</a></p>`
            }
        }

        function debounce(fn, wait) {
            let timer = null
            return (...args) => {
                clearTimeout(timer)
                timer = setTimeout(() => fn(...args), wait)
            }
        }

        function route() {
            const path = window.location.pathname
            const match = path.match(/^\/blog\/([^/]+)\/?$/)
            const queryPost = new URLSearchParams(window.location.search).get('post')
            if (match) {
                renderPost(decodeURIComponent(match[1]))
            } else if (queryPost) {
                renderPost(queryPost)
            } else {
                renderList()
            }
        }

        route()
    </script>
</body>

</html>
